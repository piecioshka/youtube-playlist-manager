<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Przeglądaj, sortuj, zmieniaj nazwy i usuwaj swoje playlisty na YouTube."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>YouTube Playlist Manager</title>
    <script>
      // Motyw przed pierwszym malowaniem, żeby jasny nie mignął przed startem Reacta
      (function () {
        var theme = 'dark';
        try {
          if (
            localStorage.getItem('youtube-playlist-manager.theme') === 'light'
          ) {
            theme = 'light';
          }
        } catch (error) {
          // Zablokowany storage: zostaje domyślny ciemny
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
